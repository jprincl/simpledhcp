name: Build DHCP Server EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate project file
        id: locate
        shell: pwsh
        run: |
          # Find the .csproj wherever it ended up in the repository,
          # so the build does not depend on the exact folder layout.
          $proj = Get-ChildItem -Path . -Recurse -Filter SimpleDhcpServer.csproj | Select-Object -First 1
          if (-not $proj) {
            Write-Host "Repository contents (depth 3):"
            Get-ChildItem -Recurse -Depth 3 | ForEach-Object { $_.FullName }
            throw "SimpleDhcpServer.csproj not found in the repository"
          }
          Write-Host "Found project: $($proj.FullName)"
          "path=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish (.NET Framework 4.8 exe)
        shell: pwsh
        run: dotnet publish "${{ steps.locate.outputs.path }}" -c Release -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDhcpServer-exe
          path: publish/SimpleDhcpServer.exe

      - name: Create GitHub Release (only for tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/SimpleDhcpServer.exe
